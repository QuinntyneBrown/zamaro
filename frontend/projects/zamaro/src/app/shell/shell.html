<zm-skip-link>{{ 'common.skipToContent' | transloco }}</zm-skip-link>
<zm-top-bar
  brand="Zamaro"
  [navLabel]="'common.nav.label' | transloco"
  [links]="links()"
  [menuLabel]="'common.menu.open' | transloco"
  [menuExpanded]="menuOpen()"
  [menuControls]="menuId"
  [themeLabel]="'common.theme.dark' | transloco"
  [themePressed]="theme.isDark()"
  [account]="account()"
  [accountExpanded]="accountMenuOpen()"
  [accountControls]="accountMenuId"
  [auth]="authLink()"
  (menuOpened)="openMenu()"
  (accountOpened)="openAccountMenu()"
  (themeToggled)="theme.toggle()"
/>
@if (unverifiedEmail(); as email) {
  <zm-banner
    variant="warning"
    persistent
    [label]="'common.banner.verify.label' | transloco"
    [actionLabel]="
      (resent() ? 'common.banner.verify.sent' : 'common.banner.verify.resend') | transloco
    "
    [actionDisabled]="resent() || resending()"
    (actionPressed)="resendVerification()"
    >{{
      (resent() ? 'common.banner.verify.resent' : 'common.banner.verify.body')
        | transloco: { email }
    }}</zm-banner
  >
}
@if (verified.name(); as name) {
  <zm-banner
    variant="success"
    dismissible
    [label]="'common.banner.verified.label' | transloco"
    [dismissLabel]="'common.banner.verified.dismiss' | transloco"
    (dismissed)="verified.dismiss()"
    >{{ 'common.banner.verified.body' | transloco: { name } }}</zm-banner
  >
}
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<zm-footer
  word="Zamaro"
  [tagline]="'common.footer.tagline' | transloco"
  [columns]="footerColumns()"
/>
<zm-toast-region />
