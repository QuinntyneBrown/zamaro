<zm-skip-link>{{ 'common.skipToContent' | transloco }}</zm-skip-link>
<zm-top-bar
  brand="Zamaro"
  [navLabel]="'common.nav.label' | transloco"
  [links]="links()"
  [menuLabel]="'common.menu.open' | transloco"
  [menuExpanded]="menuOpen()"
  [menuControls]="menuId"
  [themeLabel]="'common.theme.dark' | transloco"
  [themePressed]="theme.isDark()"
  [account]="account()"
  [accountExpanded]="accountMenuOpen()"
  [accountControls]="accountMenuId"
  [auth]="authLink()"
  (menuOpened)="openMenu()"
  (accountOpened)="openAccountMenu()"
  (themeToggled)="theme.toggle()"
/>
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<zm-footer
  word="Zamaro"
  [tagline]="'common.footer.tagline' | transloco"
  [columns]="footerColumns()"
/>
<zm-toast-region />
