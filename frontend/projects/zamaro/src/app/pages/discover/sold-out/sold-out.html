<zm-empty-state [stamp]="'discover.soldOut.stamp' | transloco" [heading]="title()">
  <p class="sold-out__why">{{ explanation() }}</p>
  @if (nearbyDates().length) {
    <zm-date-swap [heading]="datesHeading()" [options]="nearbyDates()" (pick)="pickDate($event)" />
  }
  @if (wider(); as wider) {
    <zm-button slot="actions" variant="primary" (click)="widen(wider.km)"
      >{{ wider.label }} <zm-icon name="arrow-right"
    /></zm-button>
  }
  @if (store.alternatives()?.filtersApplied) {
    <zm-button slot="actions" (click)="showAllStyles()">{{
      'discover.soldOut.allStyles' | transloco
    }}</zm-button>
  }
</zm-empty-state>
