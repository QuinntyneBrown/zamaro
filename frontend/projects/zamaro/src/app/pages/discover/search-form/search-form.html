<form aria-labelledby="find-title" novalidate [formGroup]="form" (ngSubmit)="submit()">
  <zm-booking-form
    titleId="find-title"
    [heading]="'discover.form.title' | transloco"
    [stamp]="'discover.form.stamp' | transloco"
  >
    @if (errorCount()) {
      <zm-error-summary
        class="span-full"
        summaryId="error-summary"
        [headingLevel]="3"
        [autoFocus]="false"
        [heading]="'discover.errors.summary' | transloco: { count: errorCount() }"
        [items]="summaryItems()"
      />
    }
    <zm-form-field
      #dateField
      fieldId="find-date"
      type="date"
      formControlName="date"
      [label]="'discover.form.date' | transloco"
      [min]="earliest"
      [max]="latest"
      [error]="errors().date ?? null"
    />
    <zm-form-field
      fieldId="find-kind"
      type="select"
      formControlName="kind"
      [label]="'discover.form.kind' | transloco"
      [options]="kinds"
    />
    <zm-form-field
      #locationField
      fieldId="find-place"
      formControlName="location"
      autocomplete="address-level2"
      [label]="'discover.form.location' | transloco"
      [error]="errors().location ?? null"
    />
    <zm-form-field
      fieldId="find-radius"
      type="select"
      formControlName="radius"
      [label]="'discover.form.radius' | transloco"
      [options]="radii"
    />
    <zm-chip-group class="span-full" [legend]="'discover.form.cities' | transloco">
      @for (city of cities; track city) {
        <zm-chip size="sm" [pressed]="place()?.city === city" (click)="pickCity(city)">{{
          city
        }}</zm-chip>
      }
    </zm-chip-group>
    <zm-button
      class="span-full"
      variant="primary"
      size="lg"
      type="submit"
      [busy]="store.status() === 'loading'"
      >{{
        (store.status() === 'loading' ? 'discover.form.checking' : 'discover.form.submit')
          | transloco
      }}</zm-button
    >
  </zm-booking-form>
</form>
