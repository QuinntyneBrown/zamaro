@if (state() !== 'playing') {
  <button
    class="video"
    type="button"
    [attr.aria-label]="label()"
    [attr.aria-busy]="state() === 'busy' ? 'true' : null"
    [attr.aria-disabled]="state() === 'busy' ? 'true' : null"
    [attr.aria-describedby]="showError() ? errorId : null"
    (click)="play()"
  >
    <zm-artwork
      ratio="wide"
      [variant]="artVariant()"
      [tilt]="artTilt()"
      [yellow]="artYellow()"
      [label]="artLabel()"
      [photo]="poster()"
    />
    <span class="video__play">{{ stampText() }}</span>
  </button>
}
@if (hasPlayer()) {
  <video
    #player
    class="video__player"
    controls
    preload="none"
    playsinline
    [hidden]="state() !== 'playing'"
    [attr.poster]="poster()?.src"
    [attr.aria-label]="caption()"
    (playing)="onPlaying(player)"
    (play)="onPlay(player)"
    (error)="fail()"
  >
    @if (captions(); as track) {
      <track
        kind="captions"
        [attr.srclang]="track.srclang"
        [label]="track.label"
        [src]="track.src"
        default
      />
    }
  </video>
}
<span class="video__caption">{{ caption() }}</span>
<p class="inline-msg inline-msg--danger" role="status" [id]="errorId">
  @if (showError()) {
    <zm-icon name="warning" size="sm" />{{ errorText() }}
  }
</p>
