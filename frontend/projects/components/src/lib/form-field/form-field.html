<div class="field">
  <label class="field__label" [for]="fieldId()"
    >{{ label() }}
    @if (optionalMarker()) {
      <span class="field__optional">{{ optionalMarker() }}</span>
    }
  </label>
  @switch (type()) {
    @case ('select') {
      <select
        #control
        class="select"
        [id]="fieldId()"
        [disabled]="disabled()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (change)="changed($any($event.target).value)"
        (blur)="onTouched()"
      >
        @for (option of options(); track option.value) {
          <option [value]="option.value" [selected]="option.value === value()">
            {{ option.label }}
          </option>
        }
      </select>
    }
    @case ('textarea') {
      <textarea
        #control
        class="textarea"
        [id]="fieldId()"
        [value]="value()"
        [disabled]="disabled()"
        [attr.placeholder]="placeholder()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (input)="changed($any($event.target).value)"
        (blur)="onTouched()"
      ></textarea>
    }
    @default {
      <input
        #control
        class="input"
        [type]="type()"
        [id]="fieldId()"
        [value]="value()"
        [disabled]="disabled()"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.autocomplete]="autocomplete()"
        [attr.placeholder]="placeholder()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (input)="changed($any($event.target).value)"
        (blur)="onTouched()"
      />
    }
  }
  @if (error()) {
    <span class="field__error" [id]="errorId()">{{ error() }}</span>
  }
  <ng-content select="[slot=message]" />
  @if (live()) {
    <span class="visually-hidden" role="status" [id]="fieldId() + '-live'">{{ error() }}</span>
  }
</div>
