<div class="field">
  <label class="field__label" [for]="fieldId()">{{ label() }}</label>
  @if (type() === 'select') {
    <select
      #control
      class="select"
      [id]="fieldId()"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? errorId() : null"
      (change)="changed($any($event.target).value)"
      (blur)="onTouched()"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
  } @else {
    <input
      #control
      class="input"
      [type]="type()"
      [id]="fieldId()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? errorId() : null"
      (input)="changed($any($event.target).value)"
      (blur)="onTouched()"
    />
  }
  @if (error()) {
    <span class="field__error" [id]="errorId()">{{ error() }}</span>
  }
</div>
