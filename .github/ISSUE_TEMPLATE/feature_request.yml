name: Feature request
description: Propose a new feature or a change to how an existing feature behaves.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every feature and behaviour change needs a requirement, a detailed design and a mock before implementation. Use this issue to agree on the change first. See [CONTRIBUTING.md](https://github.com/QuinntyneBrown/zamaro/blob/main/CONTRIBUTING.md#proposing-features-and-behaviour-changes).
  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      multiple: true
      options:
        - Churches (bookers)
        - Artists
        - Zamaro team (administrators)
        - Contributors
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Describe it from the user's point of view.
      placeholder: As a worship coordinator, I can't ... so I ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the behaviour you want. Given-When-Then acceptance criteria are welcome.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirements
      description: Existing L1 or L2 requirements this adds to or changes.
      placeholder: L1-006, L2-028
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer this one.
  - type: checkboxes
    id: artifacts
    attributes:
      label: Artifacts
      description: Tick any you are willing to contribute.
      options:
        - label: Requirement (docs/specs)
        - label: Detailed design (docs/detailed-designs)
        - label: Mock (docs/mocks)
        - label: Implementation with acceptance tests
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/QuinntyneBrown/zamaro/blob/main/CODE_OF_CONDUCT.md).
          required: true
