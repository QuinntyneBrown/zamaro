name: zamaro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zamaro
      POSTGRES_USER: zamaro
      POSTGRES_PASSWORD: zamaro
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["${ZAMARO_POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamaro -d zamaro"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Catches every email sent to mailpit:1025. The inbox and its API are on the
  # host at :8026 (and SMTP at :1026), off Mailpit's defaults, which other local stacks often hold.
  mailpit:
    image: axllent/mailpit:v1.27.11
    ports: ["1026:1025", "8026:8025"]

volumes:
  pg-data:
