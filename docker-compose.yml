name: zamaro

x-api: &api
  build:
    context: ./backend
  volumes:
    - ./backend:/var/www/html
    - api-vendor:/var/www/html/vendor
  env_file: ./backend/.env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zamaro
      POSTGRES_USER: zamaro
      POSTGRES_PASSWORD: zamaro
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamaro -d zamaro"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *api
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health/ready"]
      interval: 5s
      retries: 20

  worker:
    <<: *api
    command: php artisan horizon

  scheduler:
    <<: *api
    command: php artisan schedule:work

volumes:
  pg-data:
  api-vendor:
